plugins {
	id 'com.diffplug.spotless' version '8.9.0' apply false
	id 'org.sonarqube' version '7.4.0.8496'
}

ext {
	awsSdkVersion = '2.53.0'
}

allprojects {
	group = 'com.gii'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'checkstyle'
	apply plugin: 'jacoco'
	apply plugin: 'com.diffplug.spotless'

	checkstyle {
		toolVersion = "13.4.1"
		configFile = file("${rootDir}/google_checks.xml")
		ignoreFailures = false
		maxWarnings = 0
	}

	tasks.withType(Checkstyle).configureEach {
		reports {
			xml.required = true
			html.required = true
		}
	}

	spotless {
		java {
			target 'src/**/*.java'
			googleJavaFormat()
			removeUnusedImports()
			trimTrailingWhitespace()
			endWithNewline()
		}
	}

	jacoco {
		toolVersion = '0.8.13'
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}

	tasks.withType(JacocoReport).configureEach {
		dependsOn tasks.withType(Test)

		reports {
			xml.required = true
			html.required = true
			csv.required = false
		}
	}

	tasks.matching { it.name == 'test' }.configureEach {
		finalizedBy tasks.withType(JacocoReport)
	}

	def verifyAwsSdkVersionAlignment = tasks.register('verifyAwsSdkVersionAlignment') {
		group = 'verification'
		description = 'Fails when AWS SDK modules resolve to different versions.'

		doLast {
			def runtimeClasspath = configurations.findByName('runtimeClasspath')
			if (runtimeClasspath == null) {
				return
			}

			def awsSdkModules = runtimeClasspath.incoming.resolutionResult.allComponents
					.collect { it.moduleVersion }
					.findAll { it != null && it.group == 'software.amazon.awssdk' }
			def resolvedVersions = awsSdkModules.collect { it.version }.toSet()
			def expectedVersion = rootProject.awsSdkVersion

			if (!resolvedVersions.isEmpty()
					&& (resolvedVersions.size() != 1 || !resolvedVersions.contains(expectedVersion))) {
				def dependencyList = awsSdkModules
						.collect { "${it.group}:${it.name}:${it.version}" }
						.toSet()
						.sort()
						.join('\n  ')
				throw new GradleException(
						"AWS SDK modules must all use ${expectedVersion}. Resolved:\n  ${dependencyList}")
			}
		}
	}

	tasks.named('check') {
		dependsOn verifyAwsSdkVersionAlignment
	}

	plugins.withId('org.springframework.boot') {
		tasks.named('bootJar') {
			dependsOn verifyAwsSdkVersionAlignment
		}
	}
}

tasks.register('verifyAwsSdkVersionAlignment') {
	group = 'verification'
	description = 'Verifies AWS SDK version alignment in every application module.'
	dependsOn subprojects.collect { "${it.path}:verifyAwsSdkVersionAlignment" }
}

sonar {
	properties {
		property "sonar.projectKey", "e-learning"
		property "sonar.projectName", "e-learning"
		property "sonar.host.url", "http://localhost:9000"

		property "sonar.coverage.jacoco.xmlReportPaths",
				subprojects.collect {
					"${it.buildDir}/reports/jacoco/test/jacocoTestReport.xml"
				}.join(",")
	}
}
