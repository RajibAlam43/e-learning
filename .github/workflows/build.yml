name: Build and Publish Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
      ELEARNING_TEST_POSTGRES_IMAGE: ${{ vars.ELEARNING_TEST_POSTGRES_IMAGE || 'postgres:18-alpine' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Verify release automation
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test, check, and package
        run: ./gradlew clean verifyAwsSdkVersionAlignment test :api:integrationTest bootJar
      - name: Report existing formatting and Checkstyle backlog
        # These were not blocking in the previous pipeline. Keep the migration
        # focused; tighten this gate after the existing repository backlog is fixed.
        continue-on-error: true
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/reports/
            apps/*/build/test-results/
          retention-days: 7
      - name: SonarQube analysis
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.token="$SONAR_TOKEN"
          fi
      - name: Image names
        id: images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.images.outcome == 'success'
      - uses: docker/login-action@v3
        if: steps.images.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        id: api
        if: steps.images.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/api:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Publish worker
        id: worker
        if: steps.images.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/worker:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Publish migrator
        id: migrator
        if: steps.images.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/migrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/migrator:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable release
        if: steps.images.outcome == 'success'
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: python3 .github/scripts/release.py manifest --output release.json
      - name: Upload release manifest
        if: steps.images.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90
