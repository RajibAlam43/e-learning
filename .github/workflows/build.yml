name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
      ELEARNING_TEST_POSTGRES_IMAGE: ${{ vars.ELEARNING_TEST_POSTGRES_IMAGE || 'postgres:18-alpine' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected components
        id: changes
        run: python3 .github/scripts/ci.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.changes.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Verify release automation
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          node --test .github/scripts/tests/test_stage.cjs
      - name: Test and package backend
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew clean verifyAwsSdkVersionAlignment test :api:integrationTest bootJar
      - name: Report existing formatting and Checkstyle backlog
        if: steps.changes.outputs.backend == 'true'
        # These were not blocking in the previous pipeline. Keep the migration
        # focused; tighten this gate after the existing repository backlog is fixed.
        continue-on-error: true
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --continue
      - name: Upload test reports
        if: always() && steps.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/reports/
            apps/*/build/test-results/
          retention-days: 7
      - name: SonarQube analysis
        if: steps.changes.outputs.publish_backend == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.token="$SONAR_TOKEN"
          fi
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Generate Next.js types
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        run: npx --no-install next typegen
      - name: Typecheck and lint
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        run: npm run typecheck && npm run lint
      - name: Image names
        id: images
        if: steps.changes.outputs.publish_backend == 'true' || steps.changes.outputs.publish_web == 'true'
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.images.outcome == 'success'
      - uses: docker/login-action@v4
        if: steps.images.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        id: api
        if: steps.changes.outputs.publish_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/api:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Publish worker
        id: worker
        if: steps.changes.outputs.publish_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/worker:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Publish migrator
        id: migrator
        if: steps.changes.outputs.publish_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/migrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/migrator:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable release
        if: steps.changes.outputs.publish_backend == 'true'
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: python3 .github/scripts/release.py manifest --output release.json
      - name: Upload release manifest
        if: steps.changes.outputs.publish_backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90
      - name: Build stage frontend
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_APP_URL: ${{ vars.WEB_STAGE_APP_URL || 'https://stage.globalislamicinstitute.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.WEB_STAGE_API_URL || 'https://stage-api.globalislamicinstitute.com' }}
          API_URL: ${{ vars.WEB_STAGE_API_URL || 'https://stage-api.globalislamicinstitute.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.WEB_STAGE_GOOGLE_CLIENT_ID }}
          IMAGE_REMOTE_HOSTS: ${{ vars.WEB_STAGE_IMAGE_REMOTE_HOSTS }}
        run: npm run build
      - name: Publish stage frontend
        id: web_stage
        if: steps.changes.outputs.publish_web == 'true'
        uses: docker/build-push-action@v6
        with:
          # Package this environment before the next build replaces .next.
          context: apps/web
          file: apps/web/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/web:${{ steps.images.outputs.tag }}-stage
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.gii.environment=stage
          cache-from: type=gha,scope=web-stage
          cache-to: type=gha,mode=max,scope=web-stage
      - name: Record stage frontend release
        if: steps.changes.outputs.publish_web == 'true'
        env:
          IMAGE_NAME: ${{ steps.images.outputs.prefix }}/web
          IMAGE_DIGEST: ${{ steps.web_stage.outputs.digest }}
          TARGET: stage
          NEXT_PUBLIC_APP_URL: ${{ vars.WEB_STAGE_APP_URL || 'https://stage.globalislamicinstitute.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.WEB_STAGE_API_URL || 'https://stage-api.globalislamicinstitute.com' }}
        working-directory: apps/web
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          if (!/^sha256:[a-f0-9]{64}$/.test(env.IMAGE_DIGEST ?? '')) throw new Error('Invalid image digest');
          writeFileSync('web-release.json', JSON.stringify({
            service: 'web', environment: env.TARGET,
            source_sha: env.GITHUB_SHA, build_run_id: env.GITHUB_RUN_ID,
            image: `${env.IMAGE_NAME}@${env.IMAGE_DIGEST}`,
            public_app_url: env.NEXT_PUBLIC_APP_URL, public_api_url: env.NEXT_PUBLIC_API_URL
          }, null, 2) + '\n');
          JS
      - name: Upload stage frontend release
        if: steps.changes.outputs.publish_web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-stage-release
          path: apps/web/web-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Build prod frontend
        if: steps.changes.outputs.publish_web == 'true'
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_APP_URL: ${{ vars.WEB_PROD_APP_URL || 'https://globalislamicinstitute.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.WEB_PROD_API_URL || 'https://api.globalislamicinstitute.com' }}
          API_URL: ${{ vars.WEB_PROD_API_URL || 'https://api.globalislamicinstitute.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.WEB_PROD_GOOGLE_CLIENT_ID }}
          IMAGE_REMOTE_HOSTS: ${{ vars.WEB_PROD_IMAGE_REMOTE_HOSTS }}
        run: npm run build
      - name: Publish prod frontend
        id: web_prod
        if: steps.changes.outputs.publish_web == 'true'
        uses: docker/build-push-action@v6
        with:
          # Package this environment before the next build replaces .next.
          context: apps/web
          file: apps/web/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}/web:${{ steps.images.outputs.tag }}-prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.gii.environment=prod
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod
      - name: Record prod frontend release
        if: steps.changes.outputs.publish_web == 'true'
        env:
          IMAGE_NAME: ${{ steps.images.outputs.prefix }}/web
          IMAGE_DIGEST: ${{ steps.web_prod.outputs.digest }}
          TARGET: prod
          NEXT_PUBLIC_APP_URL: ${{ vars.WEB_PROD_APP_URL || 'https://globalislamicinstitute.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.WEB_PROD_API_URL || 'https://api.globalislamicinstitute.com' }}
        working-directory: apps/web
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          if (!/^sha256:[a-f0-9]{64}$/.test(env.IMAGE_DIGEST ?? '')) throw new Error('Invalid image digest');
          writeFileSync('web-release.json', JSON.stringify({
            service: 'web', environment: env.TARGET,
            source_sha: env.GITHUB_SHA, build_run_id: env.GITHUB_RUN_ID,
            image: `${env.IMAGE_NAME}@${env.IMAGE_DIGEST}`,
            public_app_url: env.NEXT_PUBLIC_APP_URL, public_api_url: env.NEXT_PUBLIC_API_URL
          }, null, 2) + '\n');
          JS
      - name: Upload prod frontend release
        if: steps.changes.outputs.publish_web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-prod-release
          path: apps/web/web-release.json
          if-no-files-found: error
          retention-days: 90
