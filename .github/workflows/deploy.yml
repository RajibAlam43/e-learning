name: Deploy App

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deploy environment
        required: true
        type: choice
        options: [stage, prod]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew clean test :api:integrationTest bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            apps/api/build/reports/tests/test/
            apps/api/build/reports/tests/integrationTest/
            apps/api/build/reports/jacoco/
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            apps/api/build/test-results/test/
            apps/api/build/test-results/integrationTest/
          retention-days: 3

      - name: JaCoCo and SonarQube analysis non-blocking
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew jacocoTestReport sonar --continue \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

      - name: Prepare artifacts deterministically
        shell: bash
        run: |
          shopt -s nullglob
          api_jars=(apps/api/build/libs/*.jar)
          worker_jars=(apps/worker/build/libs/*.jar)

          api_jar=$(printf "%s\n" "${api_jars[@]}" | grep -v -- '-plain\.jar$' | head -n1)
          worker_jar=$(printf "%s\n" "${worker_jars[@]}" | grep -v -- '-plain\.jar$' | head -n1)

          [[ -n "${api_jar}" ]] || { echo "API jar not found"; exit 1; }
          [[ -n "${worker_jar}" ]] || { echo "Worker jar not found"; exit 1; }

          cp "${api_jar}" api.jar
          cp "${worker_jar}" worker.jar

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy API
        shell: bash
        run: |
          RELEASE_ID="${GITHUB_SHA::12}"

          ssh deploy@${{ vars.API_HOST }} "mkdir -p /opt/e-learning/releases/${RELEASE_ID}"
          scp api.jar deploy@${{ vars.API_HOST }}:/opt/e-learning/releases/${RELEASE_ID}/api.jar

          cat <<'EOF' | ssh deploy@${{ vars.API_HOST }} "cat > /opt/e-learning/.env && chmod 600 /opt/e-learning/.env"
          SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE }}
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME_API }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD_API }}
          SPRING_DATA_REDIS_HOST=${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT=${{ vars.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD=${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_JWT_SECRET=${{ secrets.JWT_SECRET }}
          MUX_ACCESS_TOKEN_ID=${{ secrets.MUX_ACCESS_TOKEN_ID }}
          MUX_SECRET_KEY=${{ secrets.MUX_SECRET_KEY }}
          MUX_SIGNING_KEY_ID=${{ secrets.MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_SECRET_KEY=${{ secrets.MUX_SIGNING_SECRET_KEY }}
          MUX_SIGNING_PRIVATE_KEY=${{ secrets.MUX_SIGNING_PRIVATE_KEY }}
          BUNNY_API_KEY=${{ secrets.BUNNY_API_KEY }}
          BUNNY_LIBRARY_ID=${{ secrets.BUNNY_LIBRARY_ID }}
          BUNNY_PULL_ZONE_HOSTNAME=${{ secrets.BUNNY_PULL_ZONE_HOSTNAME }}
          BUNNY_TOKEN_AUTH_KEY=${{ secrets.BUNNY_TOKEN_AUTH_KEY }}
          PAYMENTS_SSLCOMMERZ_STORE_ID=${{ secrets.PAYMENTS_SSLCOMMERZ_STORE_ID }}
          PAYMENTS_SSLCOMMERZ_STORE_PASSWORD=${{ secrets.PAYMENTS_SSLCOMMERZ_STORE_PASSWORD }}
          PAYMENTS_BKASH_USERNAME=${{ secrets.PAYMENTS_BKASH_USERNAME }}
          PAYMENTS_BKASH_PASSWORD=${{ secrets.PAYMENTS_BKASH_PASSWORD }}
          PAYMENTS_BKASH_APP_KEY=${{ secrets.PAYMENTS_BKASH_APP_KEY }}
          PAYMENTS_BKASH_APP_SECRET=${{ secrets.PAYMENTS_BKASH_APP_SECRET }}
          PAYMENTS_BKASH_WEBHOOK_SECRET=${{ secrets.PAYMENTS_BKASH_WEBHOOK_SECRET }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ vars.R2_BUCKET }}
          ZOOM_ACCOUNT_ID=${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_HOST_USER_ID=${{ secrets.ZOOM_HOST_USER_ID }}
          GOOGLE_CALENDAR_ID=${{ vars.GOOGLE_CALENDAR_ID }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          EOF

          ssh deploy@${{ vars.API_HOST }} 'bash -s' << EOF
          set -e

          PREVIOUS_RELEASE="\$(readlink -f /opt/e-learning/current || true)"

          ln -sfn /opt/e-learning/releases/${RELEASE_ID} /opt/e-learning/current

          sudo /usr/bin/systemctl stop e-learning-api || true
          sleep 5
          sudo /usr/bin/systemctl start e-learning-api

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo 'API is healthy.'
              exit 0
            fi
            sleep 5
          done

          echo 'API failed to become healthy. Rolling back...'
          sudo /usr/bin/systemctl status e-learning-api --no-pager || true
          sudo /usr/bin/journalctl -u e-learning-api -n 150 --no-pager || true

          if [ -n "\$PREVIOUS_RELEASE" ] && [ -d "\$PREVIOUS_RELEASE" ]; then
            ln -sfn "\$PREVIOUS_RELEASE" /opt/e-learning/current
            sudo /usr/bin/systemctl restart e-learning-api
            echo "Rolled back to \$PREVIOUS_RELEASE"
          else
            echo "No previous release found; cannot rollback."
          fi

          exit 1
          EOF

      - name: Deploy Worker
        shell: bash
        run: |
          RELEASE_ID="${GITHUB_SHA::12}"

          ssh deploy@${{ vars.WORKER_HOST }} "mkdir -p /opt/e-learning/releases/${RELEASE_ID}"
          scp worker.jar deploy@${{ vars.WORKER_HOST }}:/opt/e-learning/releases/${RELEASE_ID}/worker.jar

          cat <<'EOF' | ssh deploy@${{ vars.WORKER_HOST }} "cat > /opt/e-learning/.env && chmod 600 /opt/e-learning/.env"
          SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE }}
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME_WORKER }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD_WORKER }}
          SPRING_DATA_REDIS_HOST=${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT=${{ vars.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD=${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SMS_PROVIDER_BULKSMSBD_API_KEY=${{ secrets.SMS_PROVIDER_BULKSMSBD_API_KEY }}
          SMS_PROVIDER_BULKSMSBD_SENDER_ID=${{ secrets.SMS_PROVIDER_BULKSMSBD_SENDER_ID }}
          EOF

          ssh deploy@${{ vars.WORKER_HOST }} 'bash -s' << EOF
          set -e

          PREVIOUS_RELEASE="\$(readlink -f /opt/e-learning/current || true)"

          ln -sfn /opt/e-learning/releases/${RELEASE_ID} /opt/e-learning/current
          sudo /usr/bin/systemctl restart e-learning-worker
          sleep 10

          if sudo /usr/bin/systemctl is-active --quiet e-learning-worker; then
            echo 'Worker is active.'
            exit 0
          fi

          echo 'Worker failed to become active. Rolling back...'
          sudo /usr/bin/systemctl status e-learning-worker --no-pager || true
          sudo /usr/bin/journalctl -u e-learning-worker -n 150 --no-pager || true

          if [ -n "\$PREVIOUS_RELEASE" ] && [ -d "\$PREVIOUS_RELEASE" ]; then
            ln -sfn "\$PREVIOUS_RELEASE" /opt/e-learning/current
            sudo /usr/bin/systemctl restart e-learning-worker
            echo "Rolled back to \$PREVIOUS_RELEASE"
          else
            echo "No previous release found; cannot rollback."
          fi

          exit 1
          EOF
