version: 2

# One weekly version-update PR across backend, frontend and CI dependencies.
# Security updates are handled separately by Dependabot.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  - package-ecosystem: "gradle"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  - package-ecosystem: "npm"
    directory: "/apps/web"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
