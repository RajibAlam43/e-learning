plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.5.0'
}

dependencies {
    implementation project(':common')

    // API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Health/Metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // SQS
    implementation enforcedPlatform("software.amazon.awssdk:bom:${rootProject.awsSdkVersion}")
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:4.1.0'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter:4.1.0'

    // POSTGRESQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // CACHE
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // EMAIL (SES)
    implementation 'software.amazon.awssdk:ses'

    // OTHERS
    implementation 'org.projectlombok:lombok:1.18.46'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'

    // TESTS
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootJar') {
    archiveFileName = 'worker.jar'
}

tasks.named('jar') {
    enabled = false
}
