spring.profiles.active=local

spring.application.name=worker
spring.main.web-application-type=servlet
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# POSTGRES DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# VALKEY CACHE
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

spring.flyway.enabled=false

# SQS
spring.cloud.aws.sqs.listener.auto-startup=true

# SMS
sms.provider.bulksmsbd.api-key=${SMS_PROVIDER_BULKSMSBD_API_KEY}
sms.provider.bulksmsbd.sender-id=${SMS_PROVIDER_BULKSMSBD_SENDER_ID}
sms.provider.bulksmsbd.timeout-ms=5000

# SES
aws.ses.region=ap-southeast-1
aws.ses.access-key-id=${AWS_ACCESS_KEY_ID}
aws.ses.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.ses.from-domain=notifications.globalislamicinstitute.com
aws.ses.from-local-part=no-reply

# SSLCOMMERZ
payments.sslcommerz.validation-timeout-ms=10000
payments.sslcommerz.request-timeout-ms=10000
payments.sslcommerz.store-id=${PAYMENTS_SSLCOMMERZ_STORE_ID}
payments.sslcommerz.store-password=${PAYMENTS_SSLCOMMERZ_STORE_PASSWORD}
