spring.profiles.active=local

spring.application.name=worker
spring.main.web-application-type=servlet
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# POSTGRES DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.flyway.enabled=false

# SQS
spring.cloud.aws.sqs.listener.auto-startup=true

# SMS
sms.provider.bulksmsbd.api-key=${SMS_PROVIDER_BULKSMSBD_API_KEY}
sms.provider.bulksmsbd.sender-id=${SMS_PROVIDER_BULKSMSBD_SENDER_ID}
sms.provider.bulksmsbd.timeout-ms=5000

# SES
aws.ses.region=ap-southeast-1
aws.ses.access-key-id=${AWS_ACCESS_KEY_ID}
aws.ses.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.ses.from-domain=notifications.globalislamicinstitute.com
aws.ses.from-local-part=no-reply

# SSLCOMMERZ
payments.sslcommerz.validation-timeout-ms=10000
payments.sslcommerz.request-timeout-ms=10000
payments.sslcommerz.store-id=${PAYMENTS_SSLCOMMERZ_STORE_ID}
payments.sslcommerz.store-password=${PAYMENTS_SSLCOMMERZ_STORE_PASSWORD}

# Recording jobs are claimed durably from PostgreSQL; no additional SQS queue is needed.
recordings.enabled=${RECORDINGS_ENABLED:false}
recordings.s3.bucket=${RECORDINGS_S3_BUCKET:}
recordings.s3.region=${RECORDINGS_S3_REGION:ap-southeast-1}
recordings.s3.access-key-id=${RECORDINGS_S3_ACCESS_KEY_ID:}
recordings.s3.secret-access-key=${RECORDINGS_S3_SECRET_ACCESS_KEY:}
recordings.ffmpeg=${RECORDINGS_FFMPEG:ffmpeg}
recordings.ffprobe=${RECORDINGS_FFPROBE:ffprobe}
