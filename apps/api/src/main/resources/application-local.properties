server.ssl.enabled=false

# JWT
app.jwt.secret=BASE64_SECRET

# POSTGRES DB
spring.datasource.url=jdbc:postgresql://localhost:5432/elearning
spring.datasource.username=postgres
spring.datasource.password=<REPLACE_WITH_YOUR_PASSWORD>
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# VALKEY CACHE
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=<REPLACE_WITH_YOUR_PASSWORD>

# SQS
email.jobs.main.queue=gii-local-email-jobs-queue
sms.jobs.main.queue=gii-local-sms-jobs-queue
payments.sslcommerz.validation.jobs.queue=gii-local-sslcommerz-validation-queue

# MUX
mux.signing-key-id=<MUX_SIGNING_KEY_ID>
mux.private-key-pem=<MUX_SIGNING_PRIVATE_KEY>
# BUNNY
bunny.token-security-key=<BUNNY_API_KEY>

# Cloudflare R2 (S3-compatible)
storage.r2.account-id=<R2_ACCOUNT_ID>
storage.r2.access-key-id=<R2_ACCESS_KEY_ID>
storage.r2.secret-access-key=<R2_SECRET_ACCESS_KEY>
storage.r2.bucket=<R2_BUCKET>
assets.base-url=

# SSLCommerz integration
payments.frontend-base-url=http://localhost:3000/payment/result
payments.callback-base-url=<base-url-for-payment-callbacks>
payments.sslcommerz.session-api-url=<SSL_COMMERZ_SESSION_API_URL>
payments.sslcommerz.validation-api-url=<SSL_COMMERZ_VALIDATION_API_URL>
payments.sslcommerz.store-id=<PAYMENTS_SSLCOMMERZ_STORE_ID>
payments.sslcommerz.store-password=test-password

# bKash checkout integration
payments.bkash.base-url=<BKASH_BASE_URL>
payments.bkash.username=<PAYMENTS_BKASH_USERNAME>
payments.bkash.password=test-password
payments.bkash.app-key=<PAYMENTS_BKASH_APP_KEY>
payments.bkash.app-secret=<PAYMENTS_BKASH_APP_SECRET>
payments.bkash.webhook-secret=<PAYMENTS_BKASH_WEBHOOK_SECRET>
redirect.subdomain=local-api

# CORS
app.cors.allowed-origins=*
app.cors.allowed-origin-patterns=*

# Live class provider integrations
integrations.zoom.account-id=<ZOOM_ACCOUNT_ID>
integrations.zoom.client-id=<ZOOM_CLIENT_ID>
integrations.zoom.client-secret=<ZOOM_CLIENT_SECRET>
integrations.zoom.host-user-id=<ZOOM_HOST_USER_ID>
integrations.google-calendar.calendar-id=<GOOGLE_CALENDAR_ID>
integrations.google-oauth.client-id=<GOOGLE_CLIENT_ID>
integrations.google-oauth.client-secret=<GOOGLE_CLIENT_SECRET>
integrations.google-oauth.refresh-token=<GOOGLE_REFRESH_TOKEN>
