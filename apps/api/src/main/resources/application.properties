spring.profiles.active=local

spring.application.name=api
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# POSTGRES DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway
spring.flyway.enabled=false

# VALKEY CACHE
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# JWT
app.jwt.access-token-expiration-ms=900000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# SQS
email.jobs.publish-timeout-ms=5000
sms.jobs.publish-timeout-ms=5000

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# General API documentation
springdoc.api-docs.title=Global Islamic Institute Backend API
springdoc.api-docs.description=Comprehensive LMS for online course delivery
springdoc.api-docs.version=OPENAPI_3_1
springdoc.api-docs.contact.name=Rajib Alam
springdoc.api-docs.contact.email=rajibalam202@gmail.com
springdoc.api-docs.contact.url=

# MUX
mux.signing-key-id=${MUX_SIGNING_KEY_ID}
mux.private-key-pem=${MUX_SIGNING_PRIVATE_KEY}
mux.playback-token-ttl-s=3600

# BUNNY
bunny.token-security-key=${BUNNY_API_KEY}
bunny.playback-token-ttl-s=3600

# Cloudflare R2 (S3-compatible)
storage.r2.account-id=${R2_ACCOUNT_ID}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
storage.r2.bucket=${R2_BUCKET}
storage.r2.region=auto
storage.r2.download-url-ttl-seconds=600

# SSLCommerz integration
payments.sslcommerz.validation-timeout-ms=10000
payments.sslcommerz.request-timeout-ms=10000
payments.sslcommerz.store-id=${PAYMENTS_SSLCOMMERZ_STORE_ID}
payments.sslcommerz.store-password=${PAYMENTS_SSLCOMMERZ_STORE_PASSWORD}

# bKash checkout integration
payments.bkash.username=${PAYMENTS_BKASH_USERNAME}
payments.bkash.password=${PAYMENTS_BKASH_PASSWORD}
payments.bkash.app-key=${PAYMENTS_BKASH_APP_KEY}
payments.bkash.app-secret=${PAYMENTS_BKASH_APP_SECRET}
payments.bkash.webhook-secret=${PAYMENTS_BKASH_WEBHOOK_SECRET}
payments.bkash.timeout-ms=10000

# OTP
otp.validity.minutes=15
otp.max-attempts=3
otp.rate-limit.seconds=30

